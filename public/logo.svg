<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#14161f" />
      <stop offset="100%" stop-color="#07080c" />
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="blur" />
    </filter>
    <radialGradient id="hubGrad" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#b3a6ff" />
      <stop offset="100%" stop-color="#8b7bf7" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="196" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="988" height="988" rx="180" fill="none" stroke="#1d2130" stroke-width="2" />

  <!-- soft glow behind the ring -->
  <path d="M 684.1 757.8 A 300 300 0 1 1 684.1 266.2" fill="none" stroke="#8b7bf7" stroke-width="120"
    stroke-linecap="round" opacity="0.35" filter="url(#glow)" />

  <!-- main "C" ring -->
  <path d="M 684.1 757.8 A 300 300 0 1 1 684.1 266.2" fill="none" stroke="#8b7bf7" stroke-width="72"
    stroke-linecap="round" />

  <!-- central hub : the project everything orbits around -->
  <circle cx="512" cy="512" r="58" fill="url(#hubGrad)" />

  <!-- active-point accent at the ring's upper terminus -->
  <circle cx="684.1" cy="266.2" r="30" fill="#f1eefc" />
</svg>
